name: CI Quality Gate

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  repaper-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/repaper
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './apps/repaper/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Type Check
        run: npm run type-check
        
      - name: Lint
        run: npm run lint
        
      - name: Unit Tests
        run: npm run test
        
      - name: Build
        run: npm run build
